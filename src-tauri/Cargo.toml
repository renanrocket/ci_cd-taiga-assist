[package]
name = "ci_cd-taiga-assist"
version = "0.2.1"
description = "Commit em lote, relatório com Kiro e prestação de contas no Taiga"
authors = ["Renan Rocha"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "taiga_assist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
which = "8.0.6"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "macros", "time", "io-util", "sync"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
tauri-plugin-dialog = "2.8.4"
tempfile = "3.27.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
regex = "1.13.1"
sha2 = "0.11.1"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-log = "2.10.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
httpmock = "0.9.0"
