# Testes a cada push/PR, nos três sistemas (pega cedo o que só quebra no Windows ou no macOS).
name: Testes

on:
  push:
    branches: [prod]
  pull_request:

jobs:
  testes:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependências do Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm run build
      - run: npx svelte-check
      - name: Testes do backend
        if: matrix.os != 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Testes do backend (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # O executável de teste da lib precisa do manifesto Common Controls v6 (o app real já o recebe do tauri-build).
          export RUSTFLAGS="-C link-arg=/MANIFEST:EMBED -C link-arg=/MANIFESTINPUT:$(cygpath -m "$PWD/src-tauri/windows-test.manifest")"
          cargo test --lib --manifest-path src-tauri/Cargo.toml
