# Publica uma versão: roda quando você faz push de uma tag `vX.Y.Z`.
# Gera os instaladores (Windows, macOS, Linux), assina as atualizações e publica tudo numa Release do
# GitHub, junto com o `latest.json` que os apps instalados consultam para avisar da versão nova.
name: Publicar versão

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    name: ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: "macOS (Apple Silicon)", os: macos-latest, rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin", args: "--target aarch64-apple-darwin --bundles app,dmg" }
          - { nome: "macOS (Intel)", os: macos-latest, rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin", args: "--target x86_64-apple-darwin --bundles app,dmg" }
          - { nome: "Linux (AppImage e .deb)", os: ubuntu-22.04, rust_targets: "", args: "--bundles appimage,deb" }
          - { nome: "Windows", os: windows-latest, rust_targets: "", args: "--bundles nsis" }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: A tag precisa bater com a versão do app
        shell: bash
        run: |
          versao_app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v${versao_app}" != "${GITHUB_REF_NAME}" ]; then
            echo "A tag é ${GITHUB_REF_NAME}, mas src-tauri/tauri.conf.json está em ${versao_app}. Use 'npm run versao -- X.Y.Z'."
            exit 1
          fi

      - name: Dependências do Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Número da versão para o texto da Release
        id: ver
        shell: bash
        run: echo "numero=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Taiga Assist ${{ github.ref_name }}"
          # Texto da página da Release: tabela "qual arquivo baixar" por sistema (os nomes seguem o padrão do Tauri).
          releaseBody: |
            ## Baixe para o seu sistema

            | Sistema | Arquivo | Observação |
            |---|---|---|
            | **Linux** | [AppImage](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Taiga.Assist_${{ steps.ver.outputs.numero }}_amd64.AppImage) | Recomendado. Dê permissão (`chmod +x`) e abra. Atualiza sozinho. |
            | **Linux (Debian/Ubuntu)** | [.deb](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Taiga.Assist_${{ steps.ver.outputs.numero }}_amd64.deb) | Instala pelo gerenciador de pacotes. O app só avisa quando há versão nova. |
            | **macOS, Apple Silicon (M1 a M4)** | [.dmg (aarch64)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Taiga.Assist_${{ steps.ver.outputs.numero }}_aarch64.dmg) | Macs com chip Apple. |
            | **macOS, Intel** | [.dmg (x64)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Taiga.Assist_${{ steps.ver.outputs.numero }}_x64.dmg) | Macs com processador Intel. |
            | **Windows** | [.exe (instalador)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Taiga.Assist_${{ steps.ver.outputs.numero }}_x64-setup.exe) | Windows 10/11 (64 bits). Se aparecer o aviso do SmartScreen: "Mais informações", "Executar assim mesmo". |

            Não sabe qual Mac você tem? Menu Apple, "Sobre este Mac": "Chip Apple M..." é Apple Silicon; "Processador Intel" é Intel.

            **Antes de usar:** tenha o Git e o Kiro CLI instalados. Na primeira abertura o sistema pode avisar que o app não é assinado; é só confirmar (macOS: Ajustes do Sistema, Privacidade e Segurança, "Abrir mesmo assim").

            Os outros arquivos desta página (`.sig`, `.tar.gz` e `latest.json`) são do atualizador automático. Não precisa baixá-los.
            Instalação e atualização: [docs/atualizacoes.md](https://github.com/${{ github.repository }}/blob/prod/docs/atualizacoes.md).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
