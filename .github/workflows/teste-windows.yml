# Teste do Windows sem publicar nada: roda todos os testes do backend, escreve cada falha como anotação (visível na
# página do run) e gera o instalador `.exe` como artefato para baixar e testar numa máquina Windows.
# Dispara pelo botão "Run workflow" (Actions → Teste Windows) ou ao enviar a branch `teste-windows`.
name: Teste Windows

on:
  workflow_dispatch:
  push:
    branches: [teste-windows]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Testes do backend (todas as falhas, não só a primeira)
        id: testes
        shell: bash
        continue-on-error: true
        run: |
          set +e
          # O executável de teste da lib precisa do manifesto Common Controls v6 (o app real já o recebe do tauri-build).
          export RUSTFLAGS="-C link-arg=/MANIFEST:EMBED -C link-arg=/MANIFESTINPUT:$(cygpath -m "$PWD/src-tauri/windows-test.manifest")"
          cargo test --lib --manifest-path src-tauri/Cargo.toml --no-fail-fast 2>&1 | tee teste.log
          codigo=${PIPESTATUS[0]}
          python .github/scripts/anotar.py teste.log testes
          exit $codigo

      - name: Instalador do Windows (.exe)
        id: instalador
        shell: bash
        continue-on-error: true
        run: |
          set +e
          npx tauri build --bundles nsis 2>&1 | tee build.log
          codigo=${PIPESTATUS[0]}
          [ $codigo -eq 0 ] || python .github/scripts/anotar.py build.log instalador
          exit $codigo
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-dos-testes
          path: |
            teste.log
            build.log

      - name: Falhar o run se algum teste falhou
        if: steps.testes.outcome == 'failure' || steps.instalador.outcome == 'failure'
        run: exit 1
