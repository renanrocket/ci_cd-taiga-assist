# Teste do Windows sem publicar nada: roda todos os testes do backend, escreve cada falha como anotação (visível na
# página do run) e gera o instalador `.exe` como artefato para baixar e testar numa máquina Windows.
# Dispara pelo botão "Run workflow" (Actions → Teste Windows) ou ao enviar a branch `teste-windows`.
name: Teste Windows

on:
  workflow_dispatch:
  push:
    branches: [teste-windows]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Testes do backend (todas as falhas, não só a primeira)
        id: testes
        shell: bash
        continue-on-error: true
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast 2>&1 | tee teste.log
          codigo=${PIPESTATUS[0]}
          python - <<'PY'
          import re
          def esc(t): return t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          def prop(t): return esc(t).replace(":", "%3A").replace(",", "%2C")
          log = open("teste.log", encoding="utf-8", errors="replace").read()
          blocos = re.findall(r"---- (\S+) stdout ----\n(.*?)(?=\n---- |\nfailures:\n|\Z)", log, re.S)
          for nome, corpo in blocos:
              print(f"::error title={prop('Teste falhou - ' + nome)}::{esc(corpo.strip()[:3500])}")
          if not blocos and ("test result: FAILED" in log or "test result: ok" not in log):
              print("::error title=cargo test falhou (sem teste identificado)::" + esc("\n".join(log.splitlines()[-40:])[:3500]))
          print(f"Testes com falha: {len(blocos)}")
          PY
          exit $codigo

      - name: Instalador do Windows (.exe)
        shell: bash
        run: npx tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-dos-testes
          path: teste.log

      - name: Falhar o run se algum teste falhou
        if: steps.testes.outcome == 'failure'
        run: exit 1
